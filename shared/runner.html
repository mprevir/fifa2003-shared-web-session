<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIFA shared match runner</title>
<style>
  body{font:16px system-ui;margin:1rem}
  button{font:inherit;padding:.4rem .7rem;margin:.15rem}
  #game{position:relative}
  canvas{display:block;max-width:100%;max-height:72vh;object-fit:contain;touch-action:none}
  iframe{position:absolute;inset:0;border:0;width:100%;height:72vh;opacity:0;pointer-events:none}
  pre{max-height:7em;overflow:auto}
</style>
<h1>Windows game runner</h1>
<button id="arm">Enable runner and audio</button>
<button data-seat="1" disabled>Player 1</button>
<button data-seat="2" disabled>Player 2</button>
<p id="status" role="status">Enable the runner to launch FIFA.</p>
<div id="game"></div>
<pre id="events" role="log"></pre>
<script type="module" src="runner.js"></script>
</html>
