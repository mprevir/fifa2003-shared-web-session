<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIFA 2003 lobby</title>
<style>
  body{max-width:72rem;margin:auto;padding:1rem;font:16px system-ui;background:#111820;color:#eef2f5}
  h1{font-size:1.5rem}button{font:inherit;padding:.4rem .7rem;margin:.15rem}
  #game-area{width:fit-content;max-width:100%;touch-action:none}
  video{display:block;max-width:100%;max-height:70vh;object-fit:contain;background:black;pointer-events:none}
  [hidden]{display:none}
  #game-area:fullscreen{width:100%;height:100%;background:black;outline:none}
  #game-area:fullscreen video{width:100%;height:100%;max-height:none}
</style>
<h1>FIFA 2003 lobby</h1>
<p id="status" role="status">Connecting to the room…</p>
<button data-seat="1" disabled>Player 1</button>
<button data-seat="2" disabled>Player 2</button>
<button id="reconnect" hidden>Reconnect stream</button>
<section id="match" hidden>
  <div id="game-area" role="region" aria-label="Shared FIFA match" tabindex="0">
    <video id="screen" autoplay muted playsinline inert></video>
  </div>
  <button id="fullscreen" hidden title="Press Esc to leave full screen">Full screen</button>
  <p>The Windows host controls this match.</p>
  <output id="stats"></output>
</section>
<script type="module" src="/player.js"></script>
</html>
