<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIFA native match runner</title>
<style>
  body{font:16px system-ui;margin:1rem}
  button{font:inherit;padding:.4rem .7rem;margin:.15rem}
  video{display:block;max-width:100%;max-height:72vh;object-fit:contain;background:black}
  [hidden]{display:none}
</style>
<h1>Windows game runner</h1>
<button id="session">Enable runner</button>
<button id="share" hidden>Share FIFA window</button>
<p id="status" role="status">Enable the runner to launch FIFA.</p>
<video id="preview" autoplay muted playsinline hidden></video>
<script type="module" src="/native.js"></script>
</html>
