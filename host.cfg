[host]
# Folder containing fifa2003.exe, soccer.ini and data. Enter paths without quotes.
game_dir =

# Leave blank for same-PC play. For LAN play, enter the host adapter IPv4 from ipconfig.
lan_ip =
node_port = 18337
lan_port = 18444

# Optional path to caddy.exe. When blank, LAN mode looks for Caddy on PATH.
caddy_path =

# Seat reservation after disconnect and maximum game startup time, in seconds.
reconnect_seconds = 30
startup_seconds = 180

[boxedwine]
# Mirrors must serve the exact files pinned in runtime-lock.json.
runtime_url = https://boxedwine.org/builds/demos/build/master/138/st-jit/
filesystem_url = https://boxedwine.org/v2/41/TinyCore15Wine11.0-web.zip
