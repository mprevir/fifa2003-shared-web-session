[host]
# Folder containing fifa2003.exe, soccer.ini and data. Enter paths without quotes.
game_dir = D:\projects\fifa-2003-web\runtime\playtest

# Leave blank for local use. For LAN play, enter the host adapter IPv4 from ipconfig.
lan_ip = 192.168.110.195
lan_port = 18444

# Optional path to caddy.exe. When blank, LAN mode looks for Caddy on PATH.
caddy_path = D:/projects/fifa-2003-web/web-port/fifa2003-node-host/tools/caddy.exe

# Seat reservation after disconnect and maximum game startup time, in seconds.
reconnect_seconds = 600
startup_seconds = 300
